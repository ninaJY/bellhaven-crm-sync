
name: Daily Bellhaven CRM Sync Check

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bellhaven-daily-sync
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 rapidfuzz

      - name: Scrape latest Bellhaven locations
        run: python3 src/scraper.py

      - name: Fetch current CRM snapshot
        env:
          CRM_API_TOKEN: ${{ secrets.CRM_API_TOKEN }}
        run: python3 save_snapshot.py

      - name: Validate scraped data
        run: |
          python3 - <<'PY'
          import json

          files = [
              "data/scraped_locations.json",
              "data/crm_snapshot.json",
          ]

          for path in files:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)

              if not isinstance(data, list) or not data:
                  raise ValueError(
                      f"{path} is empty or not a JSON array"
                  )

              print(f"{path}: {len(data)} records")
          PY

      - name: Generate reconciliation proposals
        run: python3 match.py

      - name: Upload reconciliation reports
        uses: actions/upload-artifact@v4
        with:
          name: bellhaven-reconciliation
          path: |
            reconcile_output/
          retention-days: 30
          if-no-files-found: error

      - name: Finish
        run: |
          echo "Daily reconciliation completed."
          echo "No CRM mutations were performed."
          echo "Proposals require human approval."
